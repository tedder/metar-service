name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag can be moved; a SHA can't). Update with the tag in the comment.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"   # matches the Lambda runtime (nodejs24.x)
      - run: node --check index.js
      - run: node --test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - name: Build deploy.zip (index.js only, reproducible)
        run: ./scripts/build-zip.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check deploy.zip (contents, matches repo, handler answers)
        run: node scripts/check-zip.js
      # The zip to deploy: download it from this run and compare its CodeSha256 with the
      # Lambda version after publishing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: deploy-zip-${{ github.sha }}
          path: deploy.zip
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0       # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
